<div class="container-fluid">
    @if (loading) {
        <div class="alert alert-info" role="status">
            Chargement des informations du Pokémon #{{id}}...
        </div>
    }

    @if (pokemon != undefined) {
        <div class="container">
            <div class="row">
                <div class="col-4" id="uno">
                    <img
                        [src]="pokemon.sprite"
                        [alt]="pokemon.name"
                        class="card-img-top"
                        loading="lazy">
                </div>
                <div class="col-8" id="duet">
                    <div>
                        <h1>N° {{ pokemon.formatPokedexId() }} - {{ pokemon.name | titlecase }}</h1>
                    </div>
                    <div class="justify-content-center">
                        @for (type of pokemon.types; track type) {
                            <img
                                [src]="type.sprite"
                                [alt]="type.name"
                                class="mx-2"
                                loading="lazy">
                        }
                    </div>
                </div>     
            </div>
        </div>
    }

</div>
